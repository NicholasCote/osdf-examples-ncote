name: Test Notebooks

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.11"
      timeout-minutes:
        description: "Per-notebook execution timeout (minutes)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  discover:
    name: Discover notebooks
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.find.outputs.notebooks }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Build notebook matrix
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.ipynb' \
            -not -path '*/.ipynb_checkpoints/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/.venv/*' \
            -not -path '*/venv/*' \
            | sed 's|^\./||' \
            | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No notebooks found"
            echo "notebooks=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${files[@]}" | jq -R . | jq -sc .)
          echo "Found ${#files[@]} notebooks:"
          printf '  %s\n' "${files[@]}"
          echo "notebooks=$json" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.notebook }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        notebook: ${{ fromJson(needs.discover.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate requirements file
        id: reqs
        run: |
          set -euo pipefail
          nb_dir="$(dirname "${{ matrix.notebook }}")"
          dir="$nb_dir"
          found=""
          while :; do
            if [ -f "$dir/requirements.txt" ]; then
              found="$dir/requirements.txt"
              break
            fi
            [ "$dir" = "." ] && break
            dir="$(dirname "$dir")"
          done

          if [ -z "$found" ]; then
            echo "No requirements.txt found for ${{ matrix.notebook }}"
            echo "requirements=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip local build paths, blank lines, and comments from conda-generated files
          cleaned="/tmp/requirements-cleaned.txt"
          grep -vE '^\s*(#|$)' "$found" \
            | grep -vE '^(/|file:)' \
            | sed -E 's/\s+#.*$//' \
            > "$cleaned"

          echo "Using $found (cleaned -> $cleaned):"
          cat "$cleaned"
          echo "requirements=$cleaned" >> "$GITHUB_OUTPUT"

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nb-test
          create-args: >-
            python=${{ inputs.python-version }}
            jupyter
            nbconvert
            ipykernel
          init-shell: bash
          cache-environment: true

      - name: Install notebook requirements
        if: steps.reqs.outputs.requirements != ''
        run: |
          set -euo pipefail
          micromamba install -y -n nb-test -c conda-forge --file "${{ steps.reqs.outputs.requirements }}"

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute "${{ matrix.notebook }}" \
            --output-dir /tmp/executed \
            --ExecutePreprocessor.timeout=$((${{ inputs.timeout-minutes }} * 60)) \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ strategy.job-index }}
          path: /tmp/executed/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Summary
    needs: [discover, test]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "## Notebook Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total notebooks: ${{ needs.discover.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more notebooks failed — check individual matrix job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
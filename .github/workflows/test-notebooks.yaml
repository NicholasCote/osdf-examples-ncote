name: Test Notebooks

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.11"
      timeout-minutes:
        description: "Per-notebook execution timeout (minutes)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  discover:
    name: Discover notebooks
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.find.outputs.notebooks }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Build notebook matrix
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.ipynb' \
            -not -path '*/.ipynb_checkpoints/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/.venv/*' \
            -not -path '*/venv/*' \
            | sed 's|^\./||' \
            | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No notebooks found"
            echo "notebooks=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${files[@]}" | jq -R . | jq -sc .)
          echo "Found ${#files[@]} notebooks:"
          printf '  %s\n' "${files[@]}"
          echo "notebooks=$json" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.notebook }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        notebook: ${{ fromJson(needs.discover.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          nb_dir="$(dirname "${{ matrix.notebook }}")"
          installed=0

          # Nearest requirements.txt (notebook dir -> repo root)
          dir="$nb_dir"
          while :; do
            if [ -f "$dir/requirements.txt" ]; then
              echo "Installing $dir/requirements.txt"
              pip install -r "$dir/requirements.txt"
              installed=1
              break
            fi
            [ "$dir" = "." ] && break
            dir="$(dirname "$dir")"
          done

          # Project definition at repo root
          if [ -f pyproject.toml ]; then
            echo "Installing project from pyproject.toml"
            pip install .
            installed=1
          fi

          if [ "$installed" -eq 0 ]; then
            echo "No requirements.txt or pyproject.toml found; installing jupyter only"
          fi

          pip install jupyter nbconvert ipykernel

      - name: Execute notebook
        working-directory: ${{ github.workspace }}
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute "${{ matrix.notebook }}" \
            --output-dir /tmp/executed \
            --ExecutePreprocessor.timeout=$((${{ inputs.timeout-minutes }} * 60)) \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ strategy.job-index }}
          path: /tmp/executed/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Summary
    needs: [discover, test]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        run: |
          echo "## Notebook Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total notebooks: ${{ needs.discover.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more notebooks failed — check individual matrix job logs." >> "$GITHUB_STEP_SUMMARY"
          fi